<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">QA Hands-On: 테스트 자동화</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .level-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .level-1 { background-color: #e0e7ff; color: #3730a3; }
        .level-2 { background-color: #dbeafe; color: #1e40af; }
        .level-3 { background-color: #e0f2fe; color: #075985; }
        .level-4 { background-color: #f0f9ff; color: #0c4a6e; }

        .placeholder-image {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border: 2px dashed #9ca3af;
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .code-result {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/qa-hands-on/overview" class="text-2xl font-bold hover:text-indigo-100 transition">
                        <i class="fas fa-vial mr-2"></i>
                        테스트 자동화 가이드
                    </a>
                </div>
                <nav class="hidden md:flex space-x-4 text-sm">
                    <a href="/qa-hands-on/overview" class="hover:text-indigo-100 transition">
                        Overview
                    </a>
                    <a href="/qa-hands-on/postman" class="hover:text-indigo-100 transition">
                        <span class="level-badge level-1 mr-1">Step 1</span>Postman
                    </a>
                    <a href="/qa-hands-on/junit" class="hover:text-indigo-100 transition">
                        <span class="level-badge level-2 mr-1">Step 2</span>JUnit
                    </a>
                    <a href="/qa-hands-on/ngrinder" class="hover:text-indigo-100 transition">
                        <span class="level-badge level-3 mr-1">Step 3</span>nGrinder
                    </a>
                    <a href="/qa-hands-on/jmeter" class="hover:text-indigo-100 transition">
                        <span class="level-badge level-4 mr-1">Step 4</span>JMeter
                    </a>
                    <a href="/qa-hands-on/cicd" class="hover:text-indigo-100 transition">
                        CI/CD
                    </a>
                    <a href="/qa-hands-on/final" class="hover:text-indigo-100 transition">
                        종합 실습
                    </a>
                </nav>
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden mt-4 space-y-2">
                <a href="/qa-hands-on/overview" class="block text-white hover:text-indigo-100 py-2">Overview</a>
                <a href="/qa-hands-on/postman" class="block text-white hover:text-indigo-100 py-2">Step 1: Postman</a>
                <a href="/qa-hands-on/junit" class="block text-white hover:text-indigo-100 py-2">Step 2: JUnit</a>
                <a href="/qa-hands-on/ngrinder" class="block text-white hover:text-indigo-100 py-2">Step 3: nGrinder</a>
                <a href="/qa-hands-on/jmeter" class="block text-white hover:text-indigo-100 py-2">Step 4: JMeter</a>
                <a href="/qa-hands-on/cicd" class="block text-white hover:text-indigo-100 py-2">CI/CD</a>
                <a href="/qa-hands-on/final" class="block text-white hover:text-indigo-100 py-2">종합 실습</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main layout:fragment="content" class="max-w-7xl mx-auto px-4 py-8">
        <!-- Content will be inserted here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="text-center text-gray-600 space-y-3">
                <p class="font-semibold text-gray-800">테스트 자동화 학습 가이드</p>
                <p class="text-sm">Postman → JUnit → nGrinder → JMeter → CI/CD</p>
                <div class="border-t border-gray-200 pt-4 mt-4">
                    <p class="text-xs text-gray-500">
                        2025 김영수 (topolo.edu@gmail.com). All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Mobile Menu Toggle Script -->
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            var menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
