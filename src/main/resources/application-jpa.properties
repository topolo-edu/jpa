
# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.highlight_sql=true

# N+1 방지
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# OSIV 비활성화
spring.jpa.open-in-view=false

# Batch Insert/Update 설정
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=INFO
logging.level.io.goorm.jpa=DEBUG
logging.level.io.goorm.jpa.service=DEBUG
logging.level.io.goorm.jpa.exception=DEBUG

# P6Spy 로거 완전 비활성화
logging.level.p6spy=OFF
logging.level.com.p6spy.engine.spy=OFF

# Hibernate SQL 로깅 (현대적 설정)
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.hibernate.orm.jdbc.extract=trace

# Spring Security 로그 (필요시만)
logging.level.org.springframework.security=WARN

# Spring Web 로그 (필요시만)
logging.level.org.springframework.web=WARN

# 로그 패턴 (시간, 레벨, 스레드, 로거명, 메시지)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# P6Spy 완전 비활성화 (Hibernate 로깅 사용)
decorator.datasource.p6spy.enable-logging=false
decorator.datasource.p6spy.multiline=false
decorator.datasource.p6spy.logging=slf4j

# Thymeleaf 캐시 비활성화 (개발 환경)
spring.thymeleaf.cache=false
